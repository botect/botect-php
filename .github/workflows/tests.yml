name: Tests
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          - php: '8.3'
            laravel: '13'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
      - run: composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.laravel == '12' && '10' || '11' }}.0" --no-interaction --no-progress
      - run: composer check
  plain-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress
      - run: php tests/plain-php.php
